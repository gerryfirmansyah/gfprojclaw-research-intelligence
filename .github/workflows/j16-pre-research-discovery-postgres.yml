name: J16 Pre-Research Discovery Observation PostgreSQL Test

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'db/verify/013_pre_research_discovery_observation_verify.sql'
      - 'db/verify/013_pre_research_discovery_observation_negative.sql'
      - 'db/migrations/013_pre_research_discovery_observation.sql'
      - '.github/workflows/j16-pre-research-discovery-postgres.yml'

jobs:
  postgres-16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create disposable database
        run: createdb gfprojclaw_j16_exploration_test
      - name: Bootstrap canonical runtime role
        run: psql -v ON_ERROR_STOP=1 -d gfprojclaw_j16_exploration_test -c "CREATE ROLE gfproj_app NOLOGIN;"
      - name: Apply canonical migrations through J15
        run: |
          for f in $(find db/migrations -maxdepth 1 -type f -name '*.sql' | sort | awk '$0 ~ /\/0(0[1-9]|1[0-2])_/ {print}'); do
            psql -v ON_ERROR_STOP=1 -d gfprojclaw_j16_exploration_test -f "$f"
          done
      - name: Apply pre-research discovery migration
        run: psql -v ON_ERROR_STOP=1 -d gfprojclaw_j16_exploration_test -f db/migrations/013_pre_research_discovery_observation.sql
      - name: Verify canonical exploration schema
        run: psql -v ON_ERROR_STOP=1 -d gfprojclaw_j16_exploration_test -f db/verify/013_pre_research_discovery_observation_verify.sql
      - name: Reject cross-session exploration lineage
        run: psql -v ON_ERROR_STOP=1 -d gfprojclaw_j16_exploration_test -f db/verify/013_pre_research_discovery_observation_negative.sql
